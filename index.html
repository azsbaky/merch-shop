<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MERCH STORE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --accent: #ff0055; /* Можно заменить на #00ff66 или #b800ff */
            --text-main: #f5f5f5;
            --text-muted: #777777;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
        }

        header {
            text-align: center;
            padding: 15px 0 25px 0;
            border-bottom: 1px solid #222;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 24px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .tab {
            background: #1a1a1a;
            color: var(--text-muted);
            border: 1px solid #2a2a2a;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
            cursor: pointer;
        }

        .tab.active {
            background: var(--text-main);
            color: #000;
            border-color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 70px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f1f1f;
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #1a1a1a;
        }

        .card-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .card-price {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .buy-btn {
            margin-top: auto;
            background: transparent;
            color: var(--text-main);
            border: 1px solid #333;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
        }

        .buy-btn:active {
            background: var(--text-main);
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>DISORDER</h1>
    </header>

    <div class="category-tabs">
        <div class="tab active">ВСЕ</div>
        <div class="tab">ХУДИ</div>
        <div class="tab">ФУТБОЛКИ</div>
        <div class="tab">АКСЕССУАРЫ</div>
    </div>

    <div class="grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=500&q=80" alt="Item">
            <div class="card-content">
                <div class="card-title">Zipped Hoodie "Pain"</div>
                <div class="card-price">4 990 ₽</div>
                <button class="buy-btn" onclick="orderItem('Zipped Hoodie Pain', 4990)">Заказать</button>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=500&q=80" alt="Item">
            <div class="card-content">
                <div class="card-title">Tee "Madkidd Tribute"</div>
                <div class="card-price">2 490 ₽</div>
                <button class="buy-btn" onclick="orderItem('Tee Madkidd Tribute', 2490)">Заказать</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function orderItem(title, price) {
            // Передаем выбранный товар в Telegram-бота
            tg.sendData(JSON.stringify({ item: title, price: price }));
        }
    </script>
</body>
</html>
